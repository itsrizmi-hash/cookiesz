<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍪 Cookie Order Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }
        
        .cookie-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .cookie-inputs > div {
            text-align: center;
        }
        
        .cookie-inputs input {
            text-align: center;
            margin-top: 0;
            border-radius: 0 0 5px 5px;
            border-top: 1px solid #ddd;
        }
        
        .cookie-inputs label {
            display: block;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px;
            border-radius: 5px 5px 0 0;
            margin-bottom: 0;
            font-weight: bold;
        }
        
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #ff5252;
        }
        
        .delivered-btn {
            background: #4ecdc4;
        }
        
        .delivered-btn:hover {
            background: #26a69a;
        }
        
        .payment-received-btn {
            background: #4caf50;
        }
        
        .payment-received-btn:hover {
            background: #45a049;
        }
        
        .payment-pending-btn {
            background: #ff9800;
        }
        
        .payment-pending-btn:hover {
            background: #f57c00;
        }
        
        .order-list {
            margin-top: 20px;
        }
        
        .order-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-item.delivered {
            background: rgba(76, 175, 80, 0.2);
        }
        
        .order-item.payment-received {
            background: rgba(76, 175, 80, 0.4);
            border: 2px solid rgba(76, 175, 80, 0.6);
        }
        
        .order-item.payment-pending {
            background: rgba(255, 152, 0, 0.3);
            border: 2px solid rgba(255, 152, 0, 0.5);
        }
        
        .total-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .summary-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .summary-title {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 18px;
            font-weight: bold;
        }
        
        .customer-info {
            flex-grow: 1;
        }
        
        .customer-name {
            font-weight: bold;
            font-size: 18px;
        }
        
        .order-details {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .order-status {
            font-size: 12px;
            margin-top: 3px;
            font-style: italic;
        }
        
        .amount {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            margin-right: 10px;
        }
        
        .price-display {
            background: rgba(255, 235, 59, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        
        .topping-checkbox {
            margin-top: 10px;
        }
        
        .topping-checkbox input {
            width: auto;
            margin-right: 5px;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .add-order-btn {
            background: #4caf50;
            padding: 12px 20px;
            font-size: 16px;
        }
        
        .add-order-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 Cookie Order Tracker</h1>
        
        <div class="input-group">
            <label>Customer Name:</label>
            <input type="text" id="customerName" placeholder="Nama customer">
        </div>
        
        <div class="input-group">
            <label>Room:</label>
            <input type="text" id="customerRoom" placeholder="C000">
        </div>
        
        <div class="input-group">
            <label>Cookie Orders:</label>
            <div class="cookie-inputs">
                <div>
                    <label style="font-size: 12px; margin-bottom: 3px;">🍫 Milk Chocolate (MC)</label>
                    <input type="number" id="mcQty" min="0" value="0">
                </div>
                <div>
                    <label style="font-size: 12px; margin-bottom: 3px;">🤎 Double Chocolate (DC)</label>
                    <input type="number" id="dcQty" min="0" value="0">
                </div>
                <div>
                    <label style="font-size: 12px; margin-bottom: 3px;">🍪 Original (OR)</label>
                    <input type="number" id="orQty" min="0" value="0">
                </div>
            </div>
        </div>
        
        <div class="topping-checkbox">
            <input type="checkbox" id="wcTopping">
            <label for="wcTopping" style="display: inline;">Add WC Topping (+RM1)</label>
        </div>
        
        <div class="price-display" id="priceDisplay">
            Total: RM0.00
        </div>
        
        <button class="add-order-btn" onclick="addOrder()">➕ Add Order</button>
        
        <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 20px;">
            <h3>📱 Quick Paste Order (from WhatsApp)</h3>
            <div class="input-group">
                <label>Paste WhatsApp Order:</label>
                <textarea id="pasteOrder" placeholder="Paste orders from WhatsApp here... 
Examples:
1. mukh c001 MC2
2. mil c311 mc3
3. Afiq c214 MC2

Or single order:
Aiman - C123
MC2 DC1 OR3 WC1" 
                style="height: 120px; resize: vertical; font-family: monospace;"></textarea>
            </div>
            <button class="add-order-btn" onclick="parseAndAddOrder()">🚀 Parse & Add Order(s)</button>
            <button onclick="parseAndAddBulkOrders()" style="background: #9c27b0; margin-left: 10px;">📋 Add All Orders</button>
            <div id="parseResult" style="margin-top: 10px; font-size: 14px; opacity: 0.8;"></div>
        </div>
    </div>
    
    <div class="container">
        <h2>📋 Order List</h2>
        <div id="orderList" class="order-list">
            <!-- Orders akan appear sini -->
        </div>
        
        <div class="total-summary">
            <div class="summary-box">
                <div class="summary-title">Total Orders</div>
                <div class="summary-value" id="totalOrders">0</div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Total Revenue</div>
                <div class="summary-value">RM<span id="totalRevenue">0.00</span></div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Pending Delivery</div>
                <div class="summary-value" id="pendingDelivery">0</div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Pending Payment</div>
                <div class="summary-value" id="pendingPayment">0</div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Payment Received</div>
                <div class="summary-value">RM<span id="paymentReceived">0.00</span></div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Total Pieces</div>
                <div class="summary-value" id="totalPieces">0</div>
            </div>
        </div>
    </div>

    <script>
        let orders = [];
        
        // Bundle pricing logic
        function calculatePrice(totalPieces) {
            if (totalPieces === 0) return 0;
            
            let remainingPieces = totalPieces;
            let totalPrice = 0;
            
            // Use 4-piece bundles first (most efficient)
            while (remainingPieces >= 4) {
                totalPrice += 6;
                remainingPieces -= 4;
            }
            
            // Handle remaining pieces
            if (remainingPieces === 3) {
                totalPrice += 5;
            } else if (remainingPieces === 2) {
                totalPrice += 3;
            } else if (remainingPieces === 1) {
                totalPrice += 2;
            }
            
            return totalPrice;
        }
        
        // Update price display when quantities change
        function updatePriceDisplay() {
            const mcQty = parseInt(document.getElementById('mcQty').value) || 0;
            const dcQty = parseInt(document.getElementById('dcQty').value) || 0;
            const orQty = parseInt(document.getElementById('orQty').value) || 0;
            const wcTopping = document.getElementById('wcTopping').checked;
            
            const totalPieces = mcQty + dcQty + orQty;
            let totalPrice = calculatePrice(totalPieces);
            
            if (wcTopping) {
                totalPrice += 1;
            }
            
            document.getElementById('priceDisplay').textContent = Total: RM${totalPrice.toFixed(2)};
        }
        
        // Add event listeners for real-time price updates
        document.getElementById('mcQty').addEventListener('input', updatePriceDisplay);
        document.getElementById('dcQty').addEventListener('input', updatePriceDisplay);
        document.getElementById('orQty').addEventListener('input', updatePriceDisplay);
        document.getElementById('wcTopping').addEventListener('change', updatePriceDisplay);

        function addOrder() {
            const name = document.getElementById('customerName').value;
            const room = document.getElementById('customerRoom').value;
            const mcQty = parseInt(document.getElementById('mcQty').value) || 0;
            const dcQty = parseInt(document.getElementById('dcQty').value) || 0;
            const orQty = parseInt(document.getElementById('orQty').value) || 0;
            const wcTopping = document.getElementById('wcTopping').checked;

            if (!name || !room) {
                alert('Sila isi nama dan room!');
                return;
            }
            
            const totalPieces = mcQty + dcQty + orQty;
            if (totalPieces === 0) {
                alert('Sila masukkan quantity cookies!');
                return;
            }

            let totalPrice = calculatePrice(totalPieces);
            if (wcTopping) {
                totalPrice += 1;
            }
            
            // Create order details string
            let orderDetails = [];
            if (mcQty > 0) orderDetails.push(MC${mcQty});
            if (dcQty > 0) orderDetails.push(DC${dcQty});
            if (orQty > 0) orderDetails.push(OR${orQty});
            if (wcTopping) orderDetails.push('WC1');

            const order = {
                id: Date.now(),
                name: name,
                room: room,
                mcQty: mcQty,
                dcQty: dcQty,
                orQty: orQty,
                wcTopping: wcTopping,
                totalPieces: totalPieces,
                totalPrice: totalPrice,
                orderDetails: orderDetails.join(' + '),
                delivered: false,
                paymentStatus: 'none' // 'none', 'pending', 'received'
            };

            orders.push(order);
            updateDisplay();
            clearInputs();
        }

        function toggleDelivered(id) {
            const order = orders.find(order => order.id === id);
            if (order) {
                order.delivered = !order.delivered;
                // Reset payment status when delivery is toggled back to false
                if (!order.delivered) {
                    order.paymentStatus = 'none';
                }
                updateDisplay();
            }
        }

        function setPaymentReceived(id) {
            const order = orders.find(order => order.id === id);
            if (order && order.delivered) {
                order.paymentStatus = 'received';
                updateDisplay();
            }
        }

        function setPaymentPending(id) {
            const order = orders.find(order => order.id === id);
            if (order && order.delivered) {
                order.paymentStatus = 'pending';
                updateDisplay();
            }
        }

        function removeOrder(id) {
            const index = orders.findIndex(order => order.id === id);
            if (index > -1) {
                orders.splice(index, 1);
                updateDisplay();
            }
        }

        function getStatusText(order) {
            if (!order.delivered) {
                return "📦 Not Delivered";
            } else if (order.paymentStatus === 'received') {
                return "✅ Delivered & Paid";
            } else if (order.paymentStatus === 'pending') {
                return "🕐 Delivered - Payment Pending";
            } else {
                return "🚚 Delivered - Payment Not Set";
            }
        }

        function updateDisplay() {
            const orderList = document.getElementById('orderList');
            
            if (orders.length === 0) {
                orderList.innerHTML = '<div style="text-align: center; opacity: 0.7;">No orders yet 📝</div>';
            } else {
                orderList.innerHTML = '';
                
                orders.forEach(order => {
                    const orderDiv = document.createElement('div');
                    let className = 'order-item';
                    if (order.delivered && order.paymentStatus === 'received') {
                        className += ' payment-received';
                    } else if (order.delivered && order.paymentStatus === 'pending') {
                        className += ' payment-pending';
                    } else if (order.delivered) {
                        className += ' delivered';
                    }
                    
                    orderDiv.className = className;
                    
                    let actionButtons = '';
                    
                    // Always show delivery toggle
                    actionButtons += `
                        <button class="${order.delivered ? 'delivered-btn' : ''}" onclick="toggleDelivered(${order.id})">
                            ${order.delivered ? '✅ Delivered' : '📦 Pending'}
                        </button>
                    `;
                    
                    // Show payment buttons only if delivered
                    if (order.delivered) {
                        if (order.paymentStatus === 'received') {
                            actionButtons += `
                                <button class="payment-received-btn" onclick="setPaymentPending(${order.id})">💰 Paid</button>
                            `;
                        } else if (order.paymentStatus === 'pending') {
                            actionButtons += `
                                <button class="payment-pending-btn" onclick="setPaymentReceived(${order.id})">🕐 Pending</button>
                            `;
                        } else {
                            actionButtons += `
                                <button onclick="setPaymentReceived(${order.id})">💰 Received</button>
                                <button class="payment-pending-btn" onclick="setPaymentPending(${order.id})">🕐 Pending</button>
                            `;
                        }
                    }
                    
                    actionButtons += <button onclick="removeOrder(${order.id})">❌</button>;
                    
                    orderDiv.innerHTML = `
                        <div class="customer-info">
                            <div class="customer-name">${order.name} - ${order.room}</div>
                            <div class="order-details">${order.orderDetails} (${order.totalPieces} pcs)</div>
                            <div class="order-status">${getStatusText(order)}</div>
                        </div>
                        <div class="amount">RM${order.totalPrice.toFixed(2)}</div>
                        <div class="action-buttons">
                            ${actionButtons}
                        </div>
                    `;
                    orderList.appendChild(orderDiv);
                });
            }

            updateSummary();
        }
        
        function updateSummary() {
            const totalOrders = orders.length;
            const totalRevenue = orders.reduce((sum, order) => sum + order.totalPrice, 0);
            const pendingDelivery = orders.filter(order => !order.delivered).length;
            const pendingPayment = orders.filter(order => order.delivered && order.paymentStatus === 'pending').length;
            const paymentReceived = orders.filter(order => order.paymentStatus === 'received').reduce((sum, order) => sum + order.totalPrice, 0);
            const totalPieces = orders.reduce((sum, order) => sum + order.totalPieces, 0);
            
            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalRevenue').textContent = totalRevenue.toFixed(2);
            document.getElementById('pendingDelivery').textContent = pendingDelivery;
            document.getElementById('pendingPayment').textContent = pendingPayment;
            document.getElementById('paymentReceived').textContent = paymentReceived.toFixed(2);
            document.getElementById('totalPieces').textContent = totalPieces;
        }

        function clearInputs() {
            document.getElementById('customerName').value = '';
            document.getElementById('customerRoom').value = '';
            document.getElementById('mcQty').value = '0';
            document.getElementById('dcQty').value = '0';
            document.getElementById('orQty').value = '0';
            document.getElementById('wcTopping').checked = false;
            updatePriceDisplay();
        }

        function parseAndAddBulkOrders() {
            const pasteText = document.getElementById('pasteOrder').value.trim();
            const resultDiv = document.getElementById('parseResult');
            
            if (!pasteText) {
                resultDiv.innerHTML = '❌ Please paste orders first!';
                resultDiv.style.color = '#ff6b6b';
                return;
            }
            
            try {
                const parsedOrders = parseMultipleOrders(pasteText);
                
                if (parsedOrders.length === 0) {
                    resultDiv.innerHTML = '❌ No valid orders found. Please check format.';
                    resultDiv.style.color = '#ff6b6b';
                    return;
                }
                
                let successCount = 0;
                let errors = [];
                
                parsedOrders.forEach((parsed, index) => {
                    if (parsed.name && parsed.room && (parsed.mcQty + parsed.dcQty + parsed.orQty > 0)) {
                        // Create order
                        let totalPrice = calculatePrice(parsed.mcQty + parsed.dcQty + parsed.orQty);
                        if (parsed.wcTopping) {
                            totalPrice += 1;
                        }
                        
                        let orderDetails = [];
                        if (parsed.mcQty > 0) orderDetails.push(MC${parsed.mcQty});
                        if (parsed.dcQty > 0) orderDetails.push(DC${parsed.dcQty});
                        if (parsed.orQty > 0) orderDetails.push(OR${parsed.orQty});
                        if (parsed.wcTopping) orderDetails.push('WC1');

                        const order = {
                            id: Date.now() + index, // Ensure unique IDs
                            name: parsed.name,
                            room: parsed.room,
                            mcQty: parsed.mcQty,
                            dcQty: parsed.dcQty,
                            orQty: parsed.orQty,
                            wcTopping: parsed.wcTopping,
                            totalPieces: parsed.mcQty + parsed.dcQty + parsed.orQty,
                            totalPrice: totalPrice,
                            orderDetails: orderDetails.join(' + '),
                            delivered: false,
                            paymentStatus: 'none'
                        };

                        orders.push(order);
                        successCount++;
                    } else {
                        errors.push(Order ${index + 1}: Missing name, room, or quantities);
                    }
                });
                
                updateDisplay();
                document.getElementById('pasteOrder').value = '';
                
                if (successCount > 0) {
                    resultDiv.innerHTML = `✅ Successfully added ${successCount} order(s)!${errors.length > 0 ? <br>⚠ ${errors.length} orders skipped due to errors. : ''}`;
                    resultDiv.style.color = '#4caf50';
                } else {
                    resultDiv.innerHTML = ❌ No orders could be processed: ${errors.join(', ')};
                    resultDiv.style.color = '#ff6b6b';
                }
                
            } catch (error) {
                resultDiv.innerHTML = '❌ Error parsing orders. Please check the format and try again.';
                resultDiv.style.color = '#ff6b6b';
            }
        }
        
        function parseMultipleOrders(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const parsedOrders = [];
            
            for (let line of lines) {
                // Skip empty lines or lines that don't look like orders
                if (!line || line.length < 5) continue;
                
                const parsed = parseSingleOrderLine(line);
                if (parsed && parsed.name && parsed.room) {
                    parsedOrders.push(parsed);
                }
            }
            
            // If no numbered orders found, try parsing as a single multi-line order
            if (parsedOrders.length === 0) {
                const singleOrder = parseOrderText(text);
                if (singleOrder.name && singleOrder.room) {
                    parsedOrders.push(singleOrder);
                }
            }
            
            return parsedOrders;
        }
        
        function parseSingleOrderLine(line) {
            // Remove number prefix (e.g., "1.", "2)", "3 ", "4-")
            let cleanLine = line.replace(/^\s*\d+[\.\)\-\s]+/, '').trim();
            
            // Remove checkmarks, invisible characters, and comments
            cleanLine = cleanLine.replace(/✅|☑|✔|⁠/g, '').trim();
            cleanLine = cleanLine.replace(/\([^)]*\)/g, '').trim(); // Remove (kalau ada) etc
            
            let name = '';
            let room = '';
            let mcQty = 0;
            let dcQty = 0;
            let orQty = 0;
            let wcTopping = false;
            
            // Special case for "bilik belajar depan bilik c006"
            if (cleanLine.includes('bilik belajar depan bilik')) {
                const specialMatch = cleanLine.match(/(.+?)-?\s*bilik\s+belajar\s+depan\s+bilik\s+([A-Za-z]?\d+)-?\s*(.*)/i);
                if (specialMatch) {
                    name = specialMatch[1].trim();
                    room = specialMatch[2].toUpperCase();
                    if (!room.match(/^[A-Za-z]/)) room = 'C' + room;
                    const orders = extractOrdersAdvanced(specialMatch[3]);
                    return { name, room, mcQty: orders.mc, dcQty: orders.dc, orQty: orders.or, wcTopping: orders.wc };
                }
            }
            
            // Special case for "koop"
            if (/\bkoop\b/i.test(cleanLine)) {
                const koopMatch = cleanLine.match(/(.+?)\s+koop\s+(.*)/i);
                if (koopMatch) {
                    name = koopMatch[1].trim();
                    room = 'KOOP';
                    const orders = extractOrdersAdvanced(koopMatch[2]);
                    return { name, room, mcQty: orders.mc, dcQty: orders.dc, orQty: orders.or, wcTopping: orders.wc };
                }
            }
            
            // Enhanced room patterns - more specific order
            const roomPatterns = [
                /\b([Cc]\d+-\d+)\b/,          // C0-16, c0-14 (with dash)
                /\b([Cc]\d-\d+)\b/,           // C3-05 (single digit with dash)
                /\b([Cc]\d{3,4})\b/,          // C001, C324, c008, c209
                /\b([Cc]\d{1,2})\b/,          // C001 shortened forms
                /\b(\d{3,4})\b/               // 001, 324 (numbers only)
            ];
            
            // Try to find room with more precise matching
            let roomMatch = null;
            let roomPattern = '';
            
            for (let pattern of roomPatterns) {
                const match = cleanLine.match(pattern);
                if (match) {
                    roomMatch = match[1];
                    roomPattern = pattern.source;
                    break;
                }
            }
            
            if (roomMatch) {
                room = roomMatch.toUpperCase();
                // Ensure room starts with C if it's just numbers
                if (/^\d/.test(room)) {
                    room = 'C' + room;
                }
            }
            
            // Extract name - everything before the room code
            if (room) {
                // Find the position of room in the original clean line
                const roomIndex = cleanLine.toUpperCase().indexOf(room);
                if (roomIndex > 0) {
                    name = cleanLine.substring(0, roomIndex).trim();
                } else {
                    // Fallback: split by space and take words before room pattern
                    const words = cleanLine.split(/\s+/);
                    const nameWords = [];
                    
                    for (let word of words) {
                        if (word.toUpperCase() === room || /^(mc|dc|or|wc)\d*/i.test(word)) {
                            break;
                        }
                        nameWords.push(word);
                    }
                    name = nameWords.join(' ').trim();
                }
            }
            
            // Extract orders from the entire line
            const orders = extractOrdersAdvanced(cleanLine);
            mcQty = orders.mc;
            dcQty = orders.dc;
            orQty = orders.or;
            wcTopping = orders.wc;
            
            // Clean up name - remove any remaining room codes or dashes
            name = name.replace(/\b[Cc]?\d+[\d\-]*\b/g, '').replace(/[-\s]+$/, '').trim();
            
            return { name, room, mcQty, dcQty, orQty, wcTopping };
        }
        
        function extractOrdersAdvanced(text) {
            let mc = 0, dc = 0, or = 0, wc = false;
            
            // Clean the text first - remove extra spaces and normalize
            text = text.replace(/\s+/g, ' ').trim();
            
            // Handle different separators: +, spaces, commas
            const parts = text.split(/[+,\s]+/).filter(part => part.length > 0);
            
            for (let part of parts) {
                part = part.trim().toUpperCase();
                
                // Extract MC orders - handle MC2, MC 2, MC2+, +MC2
                const mcMatch = part.match(/MC\s*(\d+)/);
                if (mcMatch) {
                    mc += parseInt(mcMatch[1]);
                    continue;
                }
                
                // Extract DC orders
                const dcMatch = part.match(/DC\s*(\d+)/);
                if (dcMatch) {
                    dc += parseInt(dcMatch[1]);
                    continue;
                }
                
                // Extract OR orders
                const orMatch = part.match(/OR\s*(\d+)/);
                if (orMatch) {
                    or += parseInt(orMatch[1]);
                    continue;
                }
                
                // Extract WC topping
                if (/WC\d*/.test(part) || part === 'WC') {
                    wc = true;
                    continue;
                }
            }
            
            // Alternative approach: scan the entire text for patterns
            if (mc === 0) {
                const mcMatches = text.match(/\bmc\s*(\d+)/gi);
                if (mcMatches) {
                    mc = mcMatches.reduce((sum, match) => {
                        const num = match.match(/\d+/);
                        return sum + (num ? parseInt(num[0]) : 0);
                    }, 0);
                }
            }
            
            if (dc === 0) {
                const dcMatches = text.match(/\bdc\s*(\d+)/gi);
                if (dcMatches) {
                    dc = dcMatches.reduce((sum, match) => {
                        const num = match.match(/\d+/);
                        return sum + (num ? parseInt(num[0]) : 0);
                    }, 0);
                }
            }
            
            if (or === 0) {
                const orMatches = text.match(/\bor\s*(\d+)/gi);
                if (orMatches) {
                    or = orMatches.reduce((sum, match) => {
                        const num = match.match(/\d+/);
                        return sum + (num ? parseInt(num[0]) : 0);
                    }, 0);
                }
            }
            
            if (!wc) {
                wc = /\bwc\b/i.test(text);
            }
            
            return { mc, dc, or, wc };
        }

        function parseAndAddOrder() {
            const pasteText = document.getElementById('pasteOrder').value.trim();
            const resultDiv = document.getElementById('parseResult');
            
            if (!pasteText) {
                resultDiv.innerHTML = '❌ Please paste an order first!';
                resultDiv.style.color = '#ff6b6b';
                return;
            }
            
            try {
                const parsed = parseOrderText(pasteText);
                
                if (!parsed.name || !parsed.room) {
                    resultDiv.innerHTML = '❌ Could not find customer name or room. Please check format.';
                    resultDiv.style.color = '#ff6b6b';
                    return;
                }
                
                if (parsed.mcQty + parsed.dcQty + parsed.orQty === 0) {
                    resultDiv.innerHTML = '❌ No cookie orders found. Please check order format.';
                    resultDiv.style.color = '#ff6b6b';
                    return;
                }
                
                // Fill the form with parsed data
                document.getElementById('customerName').value = parsed.name;
                document.getElementById('customerRoom').value = parsed.room;
                document.getElementById('mcQty').value = parsed.mcQty;
                document.getElementById('dcQty').value = parsed.dcQty;
                document.getElementById('orQty').value = parsed.orQty;
                document.getElementById('wcTopping').checked = parsed.wcTopping;
                
                updatePriceDisplay();
                
                // Add the order automatically
                addOrder();
                
                // Clear the paste area
                document.getElementById('pasteOrder').value = '';
                
                resultDiv.innerHTML = `✅ Successfully added: ${parsed.name} - ${parsed.room} 
                (MC${parsed.mcQty} DC${parsed.dcQty} OR${parsed.orQty}${parsed.wcTopping ? ' +WC' : ''})`;
                resultDiv.style.color = '#4caf50';
                
            } catch (error) {
                resultDiv.innerHTML = '❌ Error parsing order. Please check the format and try again.';
                resultDiv.style.color = '#ff6b6b';
            }
        }
        
        function parseOrderText(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            
            let name = '';
            let room = '';
            let mcQty = 0;
            let dcQty = 0;
            let orQty = 0;
            let wcTopping = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Try to extract name and room from same line (format: "Name - Room" or "Name Room")
                if (!name && !room) {
                    // Pattern: "Aiman - C123" or "Aiman C123"
                    const nameRoomMatch = line.match(/^(.+?)\s*[-–]\s*([A-Za-z]\d+)$/) || 
                                         line.match(/^(.+?)\s+([A-Za-z]\d+)$/);
                    if (nameRoomMatch) {
                        name = nameRoomMatch[1].trim();
                        room = nameRoomMatch[2].trim().toUpperCase();
                        continue;
                    }
                }
                
                // Try to extract name (if not found yet)
                if (!name && !line.toLowerCase().includes('room') && !hasOrderPattern(line)) {
                    // This might be just the name
                    name = line.trim();
                    continue;
                }
                
                // Try to extract room
                if (!room) {
                    // Pattern: "Room: C123", "Room C123", or just "C123"
                    const roomMatch = line.match(/(?:room\s*:?\s*)?([A-Za-z]\d+)/i);
                    if (roomMatch) {
                        room = roomMatch[1].toUpperCase();
                        continue;
                    }
                }
                
                // Try to extract orders
                if (hasOrderPattern(line)) {
                    const orders = extractOrders(line);
                    mcQty += orders.mc;
                    dcQty += orders.dc;
                    orQty += orders.or;
                    wcTopping = wcTopping || orders.wc;
                }
            }
            
            return { name, room, mcQty, dcQty, orQty, wcTopping };
        }
        
        function hasOrderPattern(text) {
            // Check if line contains order patterns like MC2, DC1, etc.
            return /\b(mc|dc|or|wc)\s*\d+/i.test(text);
        }
        
        function extractOrders(text) {
            let mc = 0, dc = 0, or = 0, wc = false;
            
            // Extract MC orders
            const mcMatches = text.match(/\bmc\s*(\d+)/gi);
            if (mcMatches) {
                mc = mcMatches.reduce((sum, match) => {
                    const num = match.match(/\d+/);
                    return sum + (num ? parseInt(num[0]) : 0);
                }, 0);
            }
            
            // Extract DC orders
            const dcMatches = text.match(/\bdc\s*(\d+)/gi);
            if (dcMatches) {
                dc = dcMatches.reduce((sum, match) => {
                    const num = match.match(/\d+/);
                    return sum + (num ? parseInt(num[0]) : 0);
                }, 0);
            }
            
            // Extract OR orders
            const orMatches = text.match(/\bor\s*(\d+)/gi);
            if (orMatches) {
                or = orMatches.reduce((sum, match) => {
                    const num = match.match(/\d+/);
                    return sum + (num ? parseInt(num[0]) : 0);
                }, 0);
            }
            
            // Extract WC topping
            const wcMatches = text.match(/\bwc\s*(\d*)/gi);
            if (wcMatches && wcMatches.length > 0) {
                wc = true;
            }
            
            return { mc, dc, or, wc };
        }

        // Initialize display
        updateDisplay();
        updatePriceDisplay();
    </script>
