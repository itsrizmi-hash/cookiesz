<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    h1, h2 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f9f9f9; margin: 5px 0; padding: 8px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🍿 Buyer Order System</h1>  <!-- Buyer ID input -->  <input type="text" id="buyerIdInput" placeholder="Enter Buyer ID (or leave blank)">  <!-- Order inputs -->  <input type="text" id="itemInput" placeholder="Item">
  <input type="number" id="qtyInput" placeholder="Qty">  <!-- Buttons --><button id="orderBtn">Place Order</button> <button id="dashboardBtn">Load My Orders</button> <button id="ownerBtn">Owner View (All Buyers)</button>

  <h2>📋 Orders</h2>
  <ul id="ordersList"></ul>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔑 Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 📌 Place Order (buyer or defaultBuyer)
    async function placeOrder(orderData, buyerIdInput) {
      const buyerId = buyerIdInput && buyerIdInput.trim() !== "" ? buyerIdInput.trim() : "defaultBuyer";
      await addDoc(collection(db, "buyers", buyerId, "orders"), orderData);
      alert(✅ Order placed under ${buyerId});
    }

    // 📌 Listen Orders in Real Time for one buyer
    function listenOrders(buyerIdInput) {
      const buyerId = buyerIdInput && buyerIdInput.trim() !== "" ? buyerIdInput.trim() : "defaultBuyer";
      const q = query(collection(db, "buyers", buyerId, "orders"), orderBy("time", "desc"));

      onSnapshot(q, (snapshot) => {
        const ordersList = document.getElementById("ordersList");
        ordersList.innerHTML = ""; 
        snapshot.forEach((doc) => {
          const li = document.createElement("li");
          const data = doc.data();
          li.textContent = Buyer: ${buyerId} | Item: ${data.item} | Qty: ${data.qty} | Time: ${new Date(data.time).toLocaleString()};
          ordersList.appendChild(li);
        });
      });
    }

    // 📌 Real-time Owner View: Show all buyers and their orders
    function listenAllOrders() {
      const ordersList = document.getElementById("ordersList");
      ordersList.innerHTML = "";

      // Listen to all buyers collection
      onSnapshot(collection(db, "buyers"), (buyersSnapshot) => {
        ordersList.innerHTML = "";
        buyersSnapshot.forEach((buyerDoc) => {
          const buyerId = buyerDoc.id;

          // Listen for each buyer's orders
          const q = query(collection(db, "buyers", buyerId, "orders"), orderBy("time", "desc"));
          onSnapshot(q, (ordersSnapshot) => {
            ordersSnapshot.forEach((orderDoc) => {
              const li = document.createElement("li");
              const data = orderDoc.data();
              li.textContent = Buyer: ${buyerId} | Item: ${data.item} | Qty: ${data.qty} | Time: ${new Date(data.time).toLocaleString()};
              ordersList.appendChild(li);
            });
          });
        });
      });
    }

    // 🔗 Event listeners
    document.getElementById("orderBtn").addEventListener("click", () => {
      const buyerId = document.getElementById("buyerIdInput").value;
      const order = {
        item: document.getElementById("itemInput").value,
        qty: Number(document.getElementById("qtyInput").value),
        time: new Date().toISOString()
      };
      placeOrder(order, buyerId);
    });

    document.getElementById("dashboardBtn").addEventListener("click", () => {
      const buyerId = document.getElementById("buyerIdInput").value;
      listenOrders(buyerId);
    });

    document.getElementById("ownerBtn").addEventListener("click", () => {
      listenAllOrders();
    });
  </script></body>
</html>
